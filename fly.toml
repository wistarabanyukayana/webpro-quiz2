# fly.toml app configuration file generated for webpro-quiz2 on 2026-11-23T22:34:53+07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'webpro-quiz2'
primary_region = 'sin'

[build]
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
